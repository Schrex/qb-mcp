[project]
name = "qb-mcp"
version = "0.1.0"
description = "Read-only MCP server for QuickBooks Desktop (qbXML over COM)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
qb-mcp = "qb_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qb_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
